# Codemagic CI/CD for the Loadit mobile app (Expo / React Native, in ./mobile).
# Builds signed iOS (.ipa) + Android (.aab). Fully env-var driven — all signing
# material lives in the Codemagic env group `loadit_env` (already configured via
# API): APP_STORE_CONNECT_PRIVATE_KEY / _KEY_IDENTIFIER / _ISSUER_ID,
# CERTIFICATE_PRIVATE_KEY (iOS dist cert), CM_KEYSTORE_B64 / _PASSWORD,
# CM_KEY_ALIAS / CM_KEY_PASSWORD (Android upload keystore).
#
# Remaining manual steps:
#   - iOS: create the app record in App Store Connect (bundle id net.loadit.app)
#     so TestFlight submission has somewhere to land.
#   - Android: to auto-publish, add a Play service-account JSON as GOOGLE_PLAY_SA
#     in loadit_env and uncomment the google_play block.

workflows:
  # ------------------------------------------------------------------ Android
  android:
    name: Loadit Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - loadit_env
      vars:
        PACKAGE_NAME: "net.loadit.app"
      node: 20.15.1
      java: 17
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install dependencies
        script: cd mobile && npm install
      - name: Expo prebuild (android)
        script: cd mobile && npx expo prebuild --platform android --no-install
      - name: Decode upload keystore
        script: |
          echo "$CM_KEYSTORE_B64" | base64 --decode > "$CM_BUILD_DIR/loadit-upload.keystore"
          echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/loadit-upload.keystore" >> $CM_ENV
      - name: Wire release signing
        script: |
          cd mobile/android
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build release AAB + APK
        script: |
          cd mobile/android
          ./gradlew bundleRelease   # .aab for the Play Store
          ./gradlew assembleRelease # .apk for direct link-install on any Android
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
      - mobile/android/app/build/outputs/**/*.apk
      - mobile/android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - trudellcolton@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once GOOGLE_PLAY_SA (Play service-account JSON) is in loadit_env:
      # google_play:
      #   credentials: $GOOGLE_PLAY_SA
      #   track: internal
      #   submit_as_draft: true

  # ---------------------------------------------------------------------- iOS
  ios:
    name: Loadit iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - loadit_env
      vars:
        BUNDLE_ID: "net.loadit.app"
        XCODE_SCHEME: "Loadit"
      node: 20.15.1
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install dependencies
        script: cd mobile && npm install
      - name: Expo prebuild (ios)
        script: cd mobile && npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: cd mobile/ios && pod install
      - name: Bump build number past latest TestFlight build
        script: |
          # ASC rejects uploads whose build number was already used; expo
          # prebuild always regenerates 1. Set it to latest-on-TestFlight + 1.
          LATEST=$(app-store-connect get-latest-testflight-build-number 6786469160 2>/dev/null | tail -1)
          case "$LATEST" in (*[!0-9]*|"") LATEST=$BUILD_NUMBER ;; esac
          NEW=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST -> using $NEW"
          cd mobile/ios && agvtool new-version -all "$NEW"
      - name: Fetch or create signing files from App Store Connect
        script: |
          keychain initialize
          # Creates the bundle id, distribution certificate (from
          # CERTIFICATE_PRIVATE_KEY), and provisioning profile if missing.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: Apply provisioning profiles
        script: cd mobile/ios && xcode-project use-profiles
      - name: Build IPA
        script: |
          cd mobile/ios
          xcode-project build-ipa \
            --workspace "$(ls -d *.xcworkspace | head -1)" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - trudellcolton@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  # ------------------------------------------------------------- iOS (ad hoc)
  # Direct OTA installs for demo devices — no TestFlight review needed. Apple
  # restriction: installs ONLY on iPhones whose UDIDs are registered in the
  # developer account (Certificates → Devices). Open the .ipa artifact link on
  # a registered iPhone (Codemagic shows an install QR/link on the build page).
  ios-adhoc:
    name: Loadit iOS Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - loadit_env
      vars:
        BUNDLE_ID: "net.loadit.app"
        XCODE_SCHEME: "Loadit"
      node: 20.15.1
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install dependencies
        script: cd mobile && npm install
      - name: Expo prebuild (ios)
        script: cd mobile && npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: cd mobile/ios && pod install
      - name: Fetch or create AD HOC signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
      - name: Apply provisioning profiles
        script: cd mobile/ios && xcode-project use-profiles
      - name: Build IPA
        script: |
          cd mobile/ios
          xcode-project build-ipa \
            --workspace "$(ls -d *.xcworkspace | head -1)" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - trudellcolton@gmail.com
        notify:
          success: true
          failure: true
